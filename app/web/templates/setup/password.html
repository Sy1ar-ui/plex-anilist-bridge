<h2>Admin password</h2>
<p>This app will hold tokens to your Plex, AniList and MyAnimeList accounts, so set a password
   before connecting them &mdash; even on a home network.</p>
{% if password_set %}<p class="ok">A password is set.</p>{% endif %}
<form method="post" action="/setup/password">
  <label>{% if password_set %}New password{% else %}Password{% endif %}
    <input name="password" type="password" minlength="8" required autocomplete="new-password">
  </label>
  <label>Again
    <input name="confirm" type="password" minlength="8" required autocomplete="new-password">
  </label>
  <button>{% if password_set %}Change password{% else %}Set password{% endif %}</button>
</form>
