{% extends "base.html" %}
{% block title %}Sign in &middot; Plex AniList Bridge{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Password <input name="password" type="password" autofocus required></label>
    <button>Sign in</button>
  </form>
</section>
{% endblock %}
