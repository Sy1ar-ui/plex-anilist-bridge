[project]
name = "plex-anilist-bridge"
version = "0.2.0"
description = "Self-hosted Plex -> AniList -> MyAnimeList sync bridge with an explain-everything web UI"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
