name: Build and publish image

# Version images (:0.6.1, :0.6) are published only through the Release
# workflow, which calls this one with the version it read from the code.
#
# There is deliberately no `push: tags` trigger. GitHub runs the workflow file
# from the tagged commit, so a tag pushed by hand onto an old commit runs that
# commit's old workflow, check or no check: v0.6.0 and v0.6.1 were tagged on
# the 0.1.1 commit and published 0.1.1 under both names. Releasing from a
# workflow on main means nobody types a tag on a stale checkout.
on:
  push:
    branches: [main]
  # Pull requests build the image for both platforms but push nothing, so a
  # broken Dockerfile or workflow shows up before merge, not on a release.
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version, e.g. 0.6.1. Publishes :<version> and :<major>.<minor>."
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # A release version must be exactly the version in app/config.py of the
      # commit being built.
      - name: Check the release version matches the app version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/check_release_tag.py "v$VERSION"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false is deliberate: metadata-action adds a ":latest" tag on
          # a semver push by default, and nothing here should ever float. Every
          # published reference is either an exact version or an exact commit.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
